<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieVerse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="hero">

        <h1>🎬 MovieVerse</h1>

        <p>
            Discover movies, ratings, cast and more
        </p>

        <div class="search-box">
            <input
                type="text"
                placeholder="Search a movie..."
                id="movieInput"
            >

            <button id="searchBtn">
                Search
            </button>
        </div>

    </div>

    <div class="trending">

        <h3>🔥 Trending Searches</h3>

        <div class="tags">

            <span id="Batman">Dhurandhar</span>
            <span id="Avatar">Avatar</span>
            <span id="Joker">Joker</span>
            <span id="Dune">Dune</span>
            <span id="Interstellar">Interstellar</span>
            <span id="Oppenheimer">Oppenheimer</span>

        </div>

    </div>
    <div class="movieContainer" id="movieContainer">
   
    </div>
   <div id="movieDetailWrapper">
    <div id="movieDetail">

    </div>
</div>
    <div class="errormsg">
        <p id="msg"></p>
    </div>
      <div class="errormsg">
        <p id="loading">🎬 Fetching Movie Details...</p>
    </div>

</div>
<script src="app.js"></script>
</body>
</html>
