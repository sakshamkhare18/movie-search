<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieVerse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="hero">

        <h1>🎬 MovieVerse</h1>

        <p>
            Discover movies, ratings, cast and more
        </p>

        <div class="search-box">
            <input
                type="text"
                placeholder="Search a movie..."
                id="movieInput"
            >

            <button id="searchBtn">
                Search
            </button>
        </div>

    </div>


    <div class="movie-card" id="movieCard">

        <div class="poster">

            <img id="Poster"
             src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba"
             alt=""
            >

        </div>

        <div class="movie-info">

            <h2 id="title">Movie Title</h2>

            <div class="badges">

                <span id="ratings">⭐ 8.9</span>
                <span id="year">📅 2023</span>

            </div>

            <p class="plot" id="plot">
                Movie description will appear here...
            </p>

            <div class="details">

                <div class="box">
                    <h4>Director</h4>
                    <p id="director">Christopher Nolan</p>
                </div>

                <div class="box">
                    <h4>Runtime</h4>
                    <p id="runtime">180 min</p>
                </div>

                <div class="box">
                    <h4>Language</h4>
                    <p id="language">English</p>
                </div>

                <div class="box">
                    <h4>Actors</h4>
                    <p id="actors">Main Cast</p>
                </div>
                 <div class="box">
                    <h4>BoxOffice</h4>
                    <p id="boxOffice">Main Cast</p>
                </div>
                <div class="box">
                    <h4>Category</h4>
                    <p id="genre">Main Cast</p>
                </div>

            </div>

        </div>

    </div>
    <div class="errormsg">
        <p id="msg"></p>
    </div>

</div>
<script src="app.js"></script>
</body>
</html>
